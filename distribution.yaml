# agent-mesh als Hermes-Profil-Distribution.
#
#   hermes profile install github.com/moinsen-dev/agent-mesh --alias
#
# Damit ist die Einrichtung eines Mesh-Agenten EIN Befehl mit einer URL —
# plattformübergreifend, versioniert über Git-Tags, aktualisierbar per
# `hermes profile update agent-mesh`, und Nutzerdaten (Gedächtnis, Sitzungen,
# Zugangsdaten) werden dabei nie angefasst. Genau das, was dieses Projekt
# vorher mit einem eigenen Installer, einem eigenen Update-Mechanismus und
# einem eigenen Dienst pro Betriebssystem selbst gebaut hat.
#
# WICHTIG — die Allowlist unten ist der Grund, warum das Framework-Repo
# zugleich die Distribution sein kann: ist `distribution_owned` gesetzt,
# kopiert der Installer AUSSCHLIESSLICH diese Pfade. Die Shell-Skripte, die
# CI und die Doku bleiben also draussen; im Profil landet nur die
# Hermes-Seite. Ohne diese Liste würde er alles kopieren.
name: agent-mesh
version: 1.36.1
description: "Ein Agent, der Teil eines Wissensverbunds ist — geteiltes Gedächtnis, verschlüsseltes Vault, signierte Releases, Antworten aus Belegen statt aus Plausibilität"
hermes_requires: ">=0.12.0"
author: "moinsen.dev"
license: "MIT"

distribution_owned:
  - SOUL.md
  - skills/
  - cron/
  - scripts/

# Der Verbund selbst braucht keine Schlüssel: die Zustellung läuft über ein
# privates Git-Repo, die Verschlüsselung über age, die Signaturen über SSH.
# Was ein Agent braucht, ist ein Modell — und welches, entscheidet die
# Maschine, nicht diese Distribution.
env_requires: []
