name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** report security problems here —
        see [SECURITY.md](https://github.com/moinsen-dev/agent-mesh/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `agent-mesh doctor`
      description: This explains most failures on its own. Redact anything private.
      render: shell
  - type: input
    id: env
    attributes:
      label: OS and shell
      placeholder: "macOS 15.5 / bash 3.2 — or: Ubuntu 24.04 / bash 5.2"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`cat ~/.agent-mesh/framework/VERSION`"
      placeholder: "1.13.0"
