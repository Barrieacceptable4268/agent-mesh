name: generate-readme-site

# Baut README.md + site/index.html aus docs/INSTALL.md + docs/COMMANDS.md
# bei jedem Push auf main. Hält Webpage und README immer synchron.

on:
  push:
    branches: [main]
    paths:
      - 'docs/INSTALL.md'
      - 'docs/COMMANDS.md'
      - 'generate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README + site
        run: python3 generate.py

      - name: Commit generated files
        run: |
          git config user.name "agent-mesh-bot"
          git config user.email "bot@moinsen.dev"
          git add README.md site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: README + site aus docs/ generiert"
            git push
          else
            echo "Keine Änderungen — nichts zu committen"
          fi
