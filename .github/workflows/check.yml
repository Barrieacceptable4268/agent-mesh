name: check

# Syntax and the patterns that this project has actually been bitten by.
# Runs on every push and pull request — including from forks, where it is the
# only thing standing between a contribution and the fleet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags, so the signature check below can see them

      - name: Syntax and audit patterns
        run: .github/scripts/check.sh

      - name: Release tag is signed by a trusted key
        # Only meaningful once a tag for this version exists. Pull requests and
        # ordinary pushes skip it; a release that fails it would freeze the
        # fleet, so it is better to find out here than on the agents.
        run: |
          v=$(cat VERSION)
          if git rev-parse "v$v" >/dev/null 2>&1; then
            git -c gpg.format=ssh \
                -c gpg.ssh.allowedSignersFile=.github/allowed_signers \
                verify-tag "v$v"
            echo "✅ v$v carries a trusted signature"
          else
            echo "ℹ️  No tag v$v yet — nothing to verify (this is normal before a release)."
          fi
